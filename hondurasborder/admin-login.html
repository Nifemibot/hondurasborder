<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — HondurasBorder</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #f0f2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
    }

    .login-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: var(--navy-dark);
      margin-bottom: 8px;
    }

    .login-card p {
      color: var(--gray-600);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--navy-dark);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .password-input {
      position: relative;
    }

    .password-input input {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--gray-500);
      padding: 0;
    }

    .password-toggle:hover {
      color: var(--navy);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--navy);
    }

    .btn-primary {
      width: 100%;
      background: var(--navy);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: var(--navy-dark);
    }

    .btn-secondary {
      width: 100%;
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .login-error {
      color: #dc2626;
      font-size: 14px;
      margin-top: 16px;
      display: none;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
        margin: 20px;
      }
    }
  </style>
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <h2>Admin Login</h2>
    <p>Enter your admin email and password to access the dashboard.</p>

    <div class="form-group">
      <label for="adminEmail">Email</label>
      <input id="adminEmail" type="email" placeholder="admin@hondurasborder.gov" autofocus onkeydown="if(event.key==='Enter') loginAdmin()" />
    </div>
    <div class="form-group">
      <label for="adminPassword">Password</label>
      <div class="password-input">
        <input id="adminPassword" type="password" placeholder="Admin@123" onkeydown="if(event.key==='Enter') loginAdmin()" />
        <button class="password-toggle" type="button" onclick="togglePassword()" aria-label="Show or hide password">👁️</button>
      </div>
    </div>

    <button class="btn-primary" id="adminLoginBtn" type="button" onclick="loginAdmin()">Log in</button>
    <button class="btn-secondary" type="button" onclick="goHome()">Back to Home</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<script src="js/data.js"></script>
<script>
window.addEventListener('load', () => {
  // Always clear session on login page load to force fresh login
  try { localStorage.removeItem('hb_session'); } catch(e) {}
  if (DB && typeof DB.init === 'function') DB.init();
});

function goHome() {
  window.location.href = 'index.html';
}

function togglePassword() {
  const passwordField = document.getElementById('adminPassword');
  const isPassword = passwordField.type === 'password';
  passwordField.type = isPassword ? 'text' : 'password';
}

function loginAdmin() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value.trim();
  const errorEl = document.getElementById('loginError');
  errorEl.style.display = 'none';

  if (!email || !password) {
    errorEl.textContent = 'Email and password are required.';
    errorEl.style.display = 'block';
    return;
  }

  const loginResult = DB.login(email, password);
  if (!loginResult) {
    errorEl.textContent = 'Invalid email or password.';
    errorEl.style.display = 'block';
    return;
  }

  try {
    localStorage.setItem('hb_session', 'true');
  } catch (e) {
    console.warn('Session storage failed:', e);
  }

  window.location.href = 'admin.html';
}
</script>

</body>
</html></content>
